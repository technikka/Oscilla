<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Oscilla | Synaptic</title>
</head>

<body>
    <header>
        <h1>Oscilla</h1>
        <p>A Laboratory for Emergent Sound</p>
    </header>

    <main>

        <canvas id="synapticCanvas" width="600" height="600"></canvas>

        <div class="controls">
            <button id="step-control" type="button">Step</button>
            <button id="play-control" type="button">Play</button>
        </div>
    </main>

    <script src="script.js"></script>
</body>

</html>
